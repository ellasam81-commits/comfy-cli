name: Repair S1E04 — clip 01 prior-episode cinematic style (one shot)

on:
  push:
    branches: [render/s1e04-final-v1]
    paths: ["references/s1e04/run-clip01-style-repair.txt"]

permissions:
  contents: read
  actions: read

concurrency:
  group: s1e04-clip01-style-repair-v1
  cancel-in-progress: false

jobs:
  repair-clip01-style:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      WHISPER_CACHE_DIR: /tmp/faster-whisper-s1e04-style-repair
      GENERATION_OUTPUT_DIR: output/s1e04-clip01-style-repair
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce single authorized style repair
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Workflow reruns are forbidden."; exit 2; }
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "references/s1e04/run-clip01-style-repair.txt" ]] || { echo "::error::Only repair trigger may change."; exit 2; }
          [[ "$(cat references/s1e04/run-clip01-style-repair.txt)" == "AUTHOR-APPROVED: REPAIR S1E04 CLIP 01 PRIOR-EPISODE STYLE ONCE" ]] || exit 2
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
      - name: Install generation and quality-check tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" "faster-whisper==1.2.1" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate references and prompt before the paid repair
        run: python scripts/generate_s1e04_clip01_gate.py --prepare-only
      - name: Arm permanent style-repair lock
        run: |
          mkdir -p output/paid-lock-s1e04-clip01-style-repair
          printf '%s\n' "One authorized S1E04 clip 01 visual-style repair in run $GITHUB_RUN_ID." > output/paid-lock-s1e04-clip01-style-repair/armed.txt
      - name: Save permanent style-repair lock
        uses: actions/cache/save@v4
        with:
          path: output/paid-lock-s1e04-clip01-style-repair
          key: segmind-s1e04-clip01-style-repair-v1
      - name: Generate the one style-repaired clip
        run: python scripts/generate_s1e04_clip01_gate.py
      - name: Upload repaired clip, evidence frames and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S1E04-Clip01-Style-Repair
          path: |
            output/s1e04-clip01-style-repair/raw/
            output/s1e04-clip01-style-repair/audit/
            output/s1e04-clip01-style-repair/proof/
            output/s1e04-clip01-style-repair/last_frames/
            output/s1e04-clip01-style-repair/runtime_refs/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
