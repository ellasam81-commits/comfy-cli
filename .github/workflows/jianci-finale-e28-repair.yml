name: Jian Ci Finale EP28 Targeted Repair
on:
  push:
    branches: [codex/jianci-transition-20260905]
    paths: [video-tests/jianci-finale-e28-repair/run.request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: jianci-finale-e28-targeted-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate only failed EP28 clip 05 once
        env:
          XRTOKEN: ${{ secrets.XRTOKEN }}
          JIANCI_EXECUTE: '1'
        run: python video-tests/jianci-finale-e28-repair/generate.py
      - name: Upload targeted repair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianci-finale-e28-clip05-repair
          path: output/jianci-finale-e28-repair
          retention-days: 14
