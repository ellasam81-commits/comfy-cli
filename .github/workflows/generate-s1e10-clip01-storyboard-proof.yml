name: Generate S1E10 clip 01 — storyboard proof (one shot only)

on:
  push:
    branches: [render/s1e10-s1e12-final-v1]
    paths: ["references/s1e10-12/run-s1e10-clip01-proof-gate-v2.txt"]

permissions:
  contents: read

concurrency:
  group: s1e10-clip01-storyboard-proof-v1
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      WHISPER_CACHE_DIR: /tmp/faster-whisper-s1e10-proof
      GENERATION_OUTPUT_DIR: output/s1e10-proof
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce the single approved storyboard-proof request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Workflow reruns are forbidden."; exit 2; }
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "references/s1e10-12/run-s1e10-clip01-proof-gate-v2.txt" ]] || { echo "::error::Only the approved proof gate may change."; exit 2; }
          [[ "$(cat references/s1e10-12/run-s1e10-clip01-proof-gate-v2.txt)" == "AUTHOR-APPROVED: GENERATE S01E10 CLIP 01 STORYBOARD PROOF V2 ONCE" ]] || exit 2
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
      - name: Install proof generation and QC tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" "faster-whisper==1.2.1" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Preflight before the single paid request
        run: |
          python -m py_compile scripts/generate_s1e10_12_five_second.py scripts/generate_s1e10_clip01_storyboard_proof.py
          test -s references/s1e10-12/storyboard_video_refs/S01E10_01_shot_1.jpg.b64
          test -s references/s1e10-12/storyboard_video_refs/S01E10_01_shot_2.jpg.b64
          test -s references/s1e10-12/storyboard_video_refs/S01E10_01_shot_3.jpg.b64
      - name: Generate and QC S01E10 clip 01 once
        run: python scripts/generate_s1e10_clip01_storyboard_proof.py
      - name: Upload proof video, frames and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S01E10-Clip01-Storyboard-Proof
          path: |
            output/s1e10-proof/
            output/s1e10-12-all/S01E10/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
