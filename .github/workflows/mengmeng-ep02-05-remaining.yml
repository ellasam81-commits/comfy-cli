name: Mengmeng EP02-05 Remaining Shots
on:
  push:
    branches: [codex/mengmeng-ep01-20260927]
    paths: [video-tests/mengmeng-ep02-05/remaining.request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: mengmeng-ep02-05-remaining
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: mengmeng-ep02-05-correction
          path: output/mengmeng-ep02-05
          run-id: 36292799555
          github-token: ${{ github.token }}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate batch 1
        env:
          XRTOKEN: ${{ secrets.XRTOKEN }}
        run: python video-tests/mengmeng-ep02-05/generate.py --batch 1 --execute
      - name: Package batch 1
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          root=Path('output/mengmeng-ep02-05')
          out=Path('exports/batch1')
          for group in ['meta','a','b']:(out/group).mkdir(parents=True,exist_ok=True)
          if (root/'report.json').exists():
              report=json.loads((root/'report.json').read_text())
              shutil.copy2(root/'report.json',out/'meta/report.json')
              for p in root.glob('*.jpg'):shutil.copy2(p,out/'meta'/p.name)
              rows=[r for r in report['clips'] if r.get('batch')=='1' and r.get('file')]
              for i,r in enumerate(rows):shutil.copy2(root/r['file'],out/('a' if i<3 else 'b')/r['file'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep02-05-batch1-meta
          path: exports/batch1/meta
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep02-05-batch1-a
          path: exports/batch1/a
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep02-05-batch1-b
          path: exports/batch1/b
          retention-days: 30
      - name: Generate batch 2
