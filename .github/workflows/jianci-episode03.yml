name: Jian Ci - Episode 03 cabinet reveal - Wan 3
on:
  push:
    branches: ["codex/jianci-transition-20260905"]
    paths: ["video-tests/jianci-case01-ep03/run.request.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: jianci-episode03
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install faster-whisper
      - name: Load existing episode two continuity footage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33978995632 --repo ellasam81-commits/comfy-cli --name jianci-episode02-regen-33978995632 --dir .runtime/episode02
      - name: Validate bounded episode
        run: |
          python video-tests/jianci-case01-ep03/generate.py
      - name: Generate six bounded episode 03 clips
        env:
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
          JIANCI_EP03_EXECUTE: "1"
          PYTHONUNBUFFERED: "1"
        run: python video-tests/jianci-case01-ep03/generate.py
      - name: Include subtitle font
        if: always()
        run: |
          mkdir -p output/jianci-episode03
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc output/jianci-episode03/
      - name: Independently transcribe dialogue
        continue-on-error: true
        run: python video-tests/jianci-case01-ep03/transcribe.py
      - name: Save outputs and request IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianci-episode03-${{ github.run_id }}
          path: output/jianci-episode03/
          if-no-files-found: warn
          retention-days: 30
