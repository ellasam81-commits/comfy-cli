name: Jian Ci Episode 04 single-speaker faulty-shot patch
on:
  push:
    branches: ["codex/jianci-transition-20260905"]
    paths: [".github/workflows/jianci-episode04-patch.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: jianci-episode04-patch
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Load approved episode four reference footage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34057579051 --repo ellasam81-commits/comfy-cli --name jianci-episode04-repair-34057579051 --dir .runtime/episode04
      - name: Validate without API calls
        run: python video-tests/jianci-case01-ep04-patch/generate.py
      - name: Generate eight five-second replacements only
        env:
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
          JIANCI_EP04_PATCH_EXECUTE: "1"
          PYTHONUNBUFFERED: "1"
        run: python video-tests/jianci-case01-ep04-patch/generate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jianci-episode04-patch-${{ github.run_id }}
          path: output/jianci-episode04-patch/
          if-no-files-found: warn
          retention-days: 30
