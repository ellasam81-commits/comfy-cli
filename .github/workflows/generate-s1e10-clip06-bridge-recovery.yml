name: Generate S1E10 — clip 06 bridge recovery (one request)

on:
  push:
    branches: [render/s1e10-s1e12-final-v1]
    paths: ["references/s1e10-12/run-s1e10-clip06-bridge-recovery-gate-v1.txt"]

permissions:
  contents: read

concurrency:
  group: s1e10-clip06-bridge-recovery-v1
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      WHISPER_CACHE_DIR: /tmp/faster-whisper-s1e10-clip06-bridge
      GENERATION_OUTPUT_DIR: output/s1e10-clip06-bridge-recovery
      S01E10_START_CLIP: "6"
      S01E10_END_CLIP: "6"
      S01E10_CONTINUITY_B64: references/s1e10-12/recovery/S01E10_05_end_bridge_ref.jpg.b64
      S01E10_END_CONTINUITY_B64: references/s1e10-12/recovery/S01E10_07_start_bridge_ref.jpg.b64
      S01E10_SEED_OFFSET: "600"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce exactly one approved one-shot request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Workflow reruns are forbidden."; exit 2; }
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "references/s1e10-12/run-s1e10-clip06-bridge-recovery-gate-v1.txt" ]] || { echo "::error::Only the approved clip 06 bridge gate may change."; exit 2; }
          [[ "$(cat references/s1e10-12/run-s1e10-clip06-bridge-recovery-gate-v1.txt)" == "AUTHOR-APPROVED: REGENERATE S01E10 CLIP 06 ONCE WITH CLIP 05 TO CLIP 07 BRIDGE" ]] || { echo "::error::Authorisation text mismatch."; exit 2; }
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
      - name: Install generation and QC tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" "faster-whisper==1.2.1" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Preflight bridge assets before paid request
        run: |
          python -m py_compile scripts/generate_s1e10_12_five_second.py scripts/generate_s1e10_clips02_12_storyboard.py
          for shot in 1 2 3; do
            test -s "references/s1e10-12/storyboard_video_refs/S01E10_06_shot_${shot}.jpg.b64"
          done
          test -s "$S01E10_CONTINUITY_B64"
          test -s "$S01E10_END_CONTINUITY_B64"
          python scripts/generate_s1e10_clips02_12_storyboard.py --preflight
      - name: Generate and QC S01E10 clip 06 once
        run: python scripts/generate_s1e10_clips02_12_storyboard.py
      - name: Upload video, evidence frames and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S01E10-Clip06-Bridge-Recovery
          path: output/s1e10-clip06-bridge-recovery/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
