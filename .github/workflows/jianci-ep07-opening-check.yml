name: Jian Ci Episode07 Opening Check
on:
  push:
    branches: [codex/jianci-transition-20260905]
    paths: [.github/workflows/jianci-ep07-opening-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: jianci-ep07-evidence-raw
          run-id: 34658014070
          github-token: ${{ github.token }}
          path: qa/raw
      - run: pip install faster-whisper
      - run: python video-tests/jianci-ep07-evidence/check_openings.py
      - uses: actions/upload-artifact@v4
        with:
          name: jianci-ep07-opening-slices
          path: qa/results.json
          retention-days: 7
