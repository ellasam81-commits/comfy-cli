name: Generate S1E06 — 12 storyboard clips (one shot each)

on:
  push:
    branches: [render/s1e06-final-v1]
    paths: ["references/s1e06/run-generate-gate.txt"]

permissions:
  contents: read

concurrency:
  group: s1e06-final-v1
  cancel-in-progress: false

jobs:
  generate-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      WHISPER_CACHE_DIR: /tmp/faster-whisper-s1e06
      GENERATION_OUTPUT_DIR: output/s1e06-all
      PREVIOUS_VIDEO_URL: "https://images.segmind.com/generations/e68d42dd-ccf9-4db0-9b7f-b20e205bd739/469f49a81fa7bd83b5bd50b0ffd68edf.mp4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce the single authorized 12-clip submission
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Workflow reruns are forbidden."; exit 2; }
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "references/s1e06/run-generate-gate.txt" ]] || { echo "::error::Only the one-shot authorization trigger may change."; exit 2; }
          [[ "$(cat references/s1e06/run-generate-gate.txt)" == "AUTHOR-APPROVED: GENERATE S1E06 CLIPS 01-12 ONCE EACH" ]] || exit 2
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
      - name: Install generation, audio-QC and assembly tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" "faster-whisper==1.2.1" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip fonts-noto-cjk
      - name: Dry-run exact storyboard and continuity contract
        run: |
          python -m py_compile scripts/generate_s1e06_five_second.py scripts/assemble_s1e06_final.py
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('references/s1e06/five_second_plan.json').read_text(encoding='utf-8'))
          assert plan['episode']=='S01E06' and plan['model']=='seedance-2.0-mini'
          assert plan['resolution']=='480p' and plan['aspect_ratio']=='16:9'
          assert plan['clip_count']==12 and plan['shots_per_clip']==4 and len(plan['clips'])==12
          assert [c['id'] for c in plan['clips']]==[f'{i:02d}' for i in range(1,13)]
          assert all(len(c['shots'])==4 for c in plan['clips'])
          assert all(Path(f'references/s1e06/panels/clip_{clip:02d}_shot_{shot}.jpg.b64').is_file() for clip in range(1,13) for shot in range(1,5))
          assert Path('references/s1e06/identity_refs/tao_wen.jpg.b64').is_file()
          assert Path('references/s1e06/identity_refs/shen_zhou.jpg.b64').is_file()
          assert Path('references/s1e03/source_refs/jian_ci_identity.jpg').is_file()
          print('Preflight passed: 12 ordered clips, four storyboard frames each, audio + subtitle QA, no-glasses Jian Ci lock.')
          PY
      - name: Generate all 12 clips once each with Mandarin-audio QC
        run: python scripts/generate_s1e06_five_second.py
      - name: Burn voice-synchronous Chinese and English subtitles, header, and package final video
        run: python scripts/assemble_s1e06_final.py
      - name: Upload raw clips, evidence frames, QC and final MP4/ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S1E06-The-Killer-Chosen-by-Numbers-Final
          path: |
            output/s1e06-all/raw/
            output/s1e06-all/audit/
            output/s1e06-all/proof/
            output/s1e06-all/last_frames/
            output/s1e06-final/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
