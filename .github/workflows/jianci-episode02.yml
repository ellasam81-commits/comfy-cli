name: Jian Ci - Episode 02 only - Wan 3
on:
  push:
    branches: ["codex/jianci-transition-20260905"]
    paths: ["video-tests/jianci-case01-ep02/run.request.json"]
permissions:
  contents: read
concurrency:
  group: jianci-episode02
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install faster-whisper
      - name: Validate bounded episode
        run: |
          python video-tests/jianci-case01-ep02/generate.py
      - name: Generate second episode only
        env:
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
          JIANCI_EP02_EXECUTE: "1"
          PYTHONUNBUFFERED: "1"
        run: python video-tests/jianci-case01-ep02/generate.py
      - name: Include subtitle font
        if: always()
        run: |
          mkdir -p output/jianci-episode02
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc output/jianci-episode02/
      - name: Independently transcribe dialogue
        continue-on-error: true
        run: python video-tests/jianci-case01-ep02/transcribe.py
      - name: Save outputs and request IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianci-episode02-${{ github.run_id }}
          path: output/jianci-episode02/
          if-no-files-found: warn
          retention-days: 30
