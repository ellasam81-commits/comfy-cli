name: Generate S1E10–12 — No-Water Drowning (one shot each)

on:
  push:
    branches: [render/s1e10-s1e12-final-v1]
    paths: ["references/s1e10-12/run-generate-gate.txt"]

permissions:
  contents: read

concurrency:
  group: s1e10-s1e12-final-v1
  cancel-in-progress: false

jobs:
  generate-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      WHISPER_CACHE_DIR: /tmp/faster-whisper-s1e10-12
      GENERATION_OUTPUT_DIR: output/s1e10-12-all
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce one approved 36-clip batch only
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Workflow reruns are forbidden."; exit 2; }
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "references/s1e10-12/run-generate-gate.txt" ]] || { echo "::error::Only the approval trigger may change."; exit 2; }
          [[ "$(cat references/s1e10-12/run-generate-gate.txt)" == "AUTHOR-APPROVED: GENERATE S1E10-S1E12 CLIPS 01-12 ONCE EACH" ]] || exit 2
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
      - name: Install generation, audio-QC and assembly tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" "faster-whisper==1.2.1" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip fonts-noto-cjk
      - name: Validate the full locked batch before paid requests
        run: |
          python -m py_compile scripts/generate_s1e10_12_five_second.py scripts/assemble_s1e10_12_final.py
          python scripts/generate_s1e10_12_five_second.py --preflight
      - name: Generate S1E10 through S1E12 once each with Mandarin-audio QC
        run: python scripts/generate_s1e10_12_five_second.py
      - name: Burn voice-synchronous Chinese and English subtitles, header, and package final videos
        run: python scripts/assemble_s1e10_12_final.py
      - name: Upload raw clips, proof frames, QC, final MP4s and ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S1E10-S1E12-NoWaterDrowning-Final
          path: |
            output/s1e10-12-all/
            output/s1e10-12-final/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
