        with:
          name: mengmeng-ep09-b
          path: |
            output/mengmeng-ep06-10/09_0[7-9]*
            output/mengmeng-ep06-10/09_1*
            output/mengmeng-ep06-10/report.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && steps.request.outputs.stage == 'rest'
