name: Jian Ci EP27 Single Lin Fix
on:
  push:
    branches: [codex/jianci-transition-20260905]
    paths: [video-tests/jianci-ep27-single-lin/run.request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: jianci-ep27-single-lin
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate only EP27 duplicated Lin shot once
        env:
          XRTOKEN: ${{ secrets.XRTOKEN }}
          JIANCI_EXECUTE: '1'
        run: python video-tests/jianci-ep27-single-lin/generate.py
      - name: Upload targeted repair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianci-ep27-single-lin
          path: output/jianci-ep27-single-lin
          retention-days: 14
