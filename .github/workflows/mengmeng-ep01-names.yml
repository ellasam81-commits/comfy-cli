name: Mengmeng EP01 Natural Character Introductions
on:
  push:
    branches: [codex/mengmeng-ep01-20260927]
    paths: [video-tests/mengmeng-ep01-names/request.json]
permissions:
  contents: read
concurrency:
  group: mengmeng-ep01-names
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate three identity shots once
        env:
          XRTOKEN: ${{ secrets.XRTOKEN }}
        run: python video-tests/mengmeng-ep01-names/generate.py --phase pilot --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mengmeng-ep01-names
          path: output/mengmeng-ep01-names
          retention-days: 30
