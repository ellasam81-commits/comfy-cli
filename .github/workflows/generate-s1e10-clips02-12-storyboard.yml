name: Generate S1E10 — clips 02-12 storyboard-locked (one request each)

on:
  push:
    branches: [render/s1e10-s1e12-final-v1]
    paths: ["references/s1e10-12/run-s1e10-clips02-12-gate-v1.txt"]

permissions:
  contents: read

concurrency:
  group: s1e10-clips02-12-storyboard-v1
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      WHISPER_CACHE_DIR: /tmp/faster-whisper-s1e10-clips02-12
      GENERATION_OUTPUT_DIR: output/s1e10-clips02-12
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce exactly eleven newly approved one-shot requests
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Workflow reruns are forbidden."; exit 2; }
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "references/s1e10-12/run-s1e10-clips02-12-gate-v1.txt" ]] || { echo "::error::Only the approved E10 remainder gate may change."; exit 2; }
          [[ "$(cat references/s1e10-12/run-s1e10-clips02-12-gate-v1.txt)" == "AUTHOR-APPROVED: GENERATE S01E10 CLIPS 02-12 STORYBOARD LOCKED ONCE" ]] || exit 2
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
      - name: Install generation and QC tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" "faster-whisper==1.2.1" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Preflight locked assets before paid requests
        run: |
          python -m py_compile scripts/generate_s1e10_12_five_second.py scripts/generate_s1e10_clips02_12_storyboard.py
          for clip in $(seq -w 02 12); do
            for shot in 1 2 3; do
              test -s "references/s1e10-12/storyboard_video_refs/S01E10_${clip}_shot_${shot}.jpg.b64"
            done
          done
          test -s references/s1e10-12/storyboard_video_refs/S01E10_01_continuity.jpg.b64
          python scripts/generate_s1e10_clips02_12_storyboard.py --preflight
      - name: Generate and QC S01E10 clips 02-12 (once each)
        run: python scripts/generate_s1e10_clips02_12_storyboard.py
      - name: Upload videos, evidence frames and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S01E10-Clips02-12-Storyboard-Locked
          path: output/s1e10-clips02-12/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
