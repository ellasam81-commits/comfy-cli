name: Jian Ci Anime Episode 01 Repair
on:
  push:
    branches: [codex/jianci-transition-20260905]
    paths: [video-tests/jianci-anime-ep01-repair/run.request.json]
permissions:
  contents: read
concurrency:
  group: jianci-anime-ep01-repair-production
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate two authorized repair clips
        env:
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
          JIANCI_ANIME_EP01_EXECUTE: '1'
        run: python video-tests/jianci-anime-ep01-repair/generate.py
      - name: Save raw results before transcription
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianci-anime-ep01-repair-raw
          path: output/jianci-anime-ep01-repair
          retention-days: 7
      - name: Install speech recognition
        if: success()
        run: pip install faster-whisper
      - name: Check Mandarin speech
        if: success()
        run: python video-tests/jianci-anime-ep01-repair/transcribe.py
      - name: Save transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianci-anime-ep01-repair-transcript
          path: output/jianci-anime-ep01-repair/transcription.json
          retention-days: 7
