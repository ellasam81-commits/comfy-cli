name: Jian Ci - Episode 04 witness and evidence - Wan 3
on:
  push:
    branches: ["codex/jianci-transition-20260905"]
    paths: ["video-tests/jianci-case01-ep04/run.request.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: jianci-episode04
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Load episode three continuity footage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34034017364 --repo ellasam81-commits/comfy-cli --name jianci-episode03-34034017364 --dir .runtime/episode02
      - name: Prepare bounded episode generator
        run: |
          cp video-tests/jianci-case01-ep03/generate.py video-tests/jianci-case01-ep04/generate.py
          sed -i 's/cfg\["episode"\] == 3/cfg["episode"] == 4/' video-tests/jianci-case01-ep04/generate.py
      - name: Validate bounded episode
        run: python video-tests/jianci-case01-ep04/generate.py
      - name: Generate six bounded episode 04 clips
        env:
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
          JIANCI_EP03_EXECUTE: "1"
          PYTHONUNBUFFERED: "1"
        run: python video-tests/jianci-case01-ep04/generate.py
      - name: Save outputs and request IDs
        if: always()
        run: |
          mkdir -p output/jianci-episode04
          cp -a output/jianci-episode03/. output/jianci-episode04/ || true
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc output/jianci-episode04/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jianci-episode04-${{ github.run_id }}
          path: output/jianci-episode04/
          if-no-files-found: warn
          retention-days: 30
