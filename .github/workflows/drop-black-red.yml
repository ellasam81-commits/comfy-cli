name: Drop Black Red Supernatural Promo
on:
  push:
    branches: [codex/drop-black-red-20260929]
    paths: [video-tests/drop-promo/request.json]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python video-tests/drop-promo/generate.py
      - name: Generate six bounded clips and preserve selected original music
        env:
          XRTOKEN: ${{ secrets.XRTOKEN }}
        run: python video-tests/drop-promo/generate.py --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drop-final-30s
          path: |
            output/drop-promo/Drop_BlackRed_30s_Clean.mp4
            output/drop-promo/report.json
            output/drop-promo/*.jpg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drop-source-clips
          path: |
            output/drop-promo/*-raw.mp4
            output/drop-promo/report.json
          retention-days: 30
