name: Jian Ci - Three models - Two scenes - 10 seconds each
on:
  push:
    branches: ["codex/jianci-transition-20260905"]
    paths: ["video-tests/jianci-transition/run.request.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jianci-three-model-test
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install video inspection and preview tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate test configuration and references
        run: |
          python -m unittest discover -s video-tests/jianci-transition -p test_jianci_transition.py
          python video-tests/jianci-transition/run_test.py
      - name: Generate three comparison clips
        env:
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
          SEGMIND_TEST_EXECUTE: "1"
          PYTHONUNBUFFERED: "1"
        run: python video-tests/jianci-transition/run_test.py
      - name: Save raw outputs, common-size previews and status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianci-three-models-${{ github.run_id }}
          path: output/jianci-transition/
          if-no-files-found: warn
          retention-days: 30

