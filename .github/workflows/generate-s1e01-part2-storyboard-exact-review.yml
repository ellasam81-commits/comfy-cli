name: Generate S1E01 Part 2 — storyboard-exact review (Segmind)

on:
  push:
    branches:
      - render/s1e01-final
    paths:
      - "references/s1e01/run-part2-storyboard-exact-review.txt"

permissions:
  contents: read

concurrency:
  group: s1e01-part2-storyboard-exact-review-v1
  cancel-in-progress: false

jobs:
  generate-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out locked inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact paid trigger
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          TRIGGER: references/s1e01/run-part2-storyboard-exact-review.txt
          BOARD: references/s1e01/board_02.jpg.b64
          CHART: references/s1e01/character_chart.jpg.b64
          WORKFLOW: .github/workflows/generate-s1e01-part2-storyboard-exact-review.yml
        run: |
          set -euo pipefail
          git cat-file -e "$BEFORE_SHA:$WORKFLOW"
          git cat-file -e "$BEFORE_SHA:$BOARD"
          git cat-file -e "$BEFORE_SHA:$CHART"
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "$TRIGGER" ]]
          [[ "$(cat "$TRIGGER")" == "AUTHOR-APPROVED EXCEPTION: GENERATE S1E01 PART 2 STORYBOARD-EXACT REVIEW ONCE" ]]

      - name: Restore one-shot paid lock
        id: paid-lock
        uses: actions/cache/restore@v4
        with:
          path: output/paid-lock
          key: segmind-s1e01-part2-storyboard-exact-review-v1
          lookup-only: true

      - name: Validate secret and unused lock
        env:
          LOCK_HIT: ${{ steps.paid-lock.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
          [[ "$LOCK_HIT" != "true" ]] || { echo "::error::This author-approved exception render was already submitted."; exit 2; }

      - name: Arm one-shot paid lock
        run: |
          mkdir -p output/paid-lock
          echo "author-approved exception; run $GITHUB_RUN_ID" > output/paid-lock/armed.txt

      - name: Save one-shot paid lock
        uses: actions/cache/save@v4
        with:
          path: output/paid-lock
          key: segmind-s1e01-part2-storyboard-exact-review-v1

      - name: Install renderer and post-production tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate only Part 2 and extract evidence frames
        run: |
          python - <<'PY'
          import base64
          import json
          import subprocess
          from pathlib import Path

          import requests
          from PIL import Image, ImageOps
          from segmind import SegmindClient


          SOURCE = Path("references/s1e01")
          RUNTIME = Path("runtime")
          RAW = Path("raw")
          FINAL = Path("final")
          for directory in (RUNTIME, RAW, FINAL):
              directory.mkdir(exist_ok=True)


          def run(*args):
              subprocess.run(list(args), check=True)


          def restore_reference(name):
              source = SOURCE / f"{name}.jpg.b64"
              target = RUNTIME / f"{name}.jpg"
              target.write_bytes(base64.b64decode(source.read_bytes()))
              return target


          def make_clean_references(board_path, chart_path):
              # The raw production boards and character chart contain labels and panel borders.
              # Upload only clean visual crops so the renderer cannot reproduce source UI/text.
              board = Image.open(board_path).convert("RGB")
              staging = board.crop((204, 85, 378, 143))
              staging = ImageOps.fit(staging, (640, 360), method=Image.Resampling.LANCZOS)
              staging_path = RUNTIME / "panel02_body_staging_clean.jpg"
              staging.save(staging_path, quality=95)

              chart = Image.open(chart_path).convert("RGB")
              # Clean figure crops only: Jian Ci at left, Lin Qian at right; no labels or chart layout.
              jian_ci = chart.crop((31, 125, 112, 310))
              lin_qian = chart.crop((129, 125, 207, 310))
              cast = Image.new("RGB", (512, 384), (18, 24, 30))
              for figure, x in ((jian_ci, 34), (lin_qian, 260)):
                  fitted = ImageOps.contain(figure, (190, 350), method=Image.Resampling.LANCZOS)
                  cast.paste(fitted, (x + (190 - fitted.width) // 2, 18))
              cast_path = RUNTIME / "jian_ci_lin_qian_clean_lock.jpg"
              cast.save(cast_path, quality=95)
              return staging_path, cast_path


          def extract_video_url(result):
              output = result.get("output") if isinstance(result, dict) else result
              candidates = []
              if isinstance(output, dict):
                  candidates.extend([output.get("video_url"), output.get("url"), output.get("video")])
              elif isinstance(output, list):
                  for item in output:
                      if isinstance(item, dict):
                          candidates.extend([item.get("video_url"), item.get("url"), item.get("video")])
                      else:
                          candidates.append(item)
              else:
                  candidates.append(output)
              for candidate in candidates:
                  if isinstance(candidate, str) and candidate.startswith(("https://", "http://")):
                      return candidate
              raise RuntimeError(f"Segmind completed without a downloadable video URL: {result}")


          board = restore_reference("board_02")
          character_chart = restore_reference("character_chart")
          body_staging, cast_lock = make_clean_references(board, character_chart)

          common = """
          Create exactly one continuous 15-second, 16:9, 480p, 24fps premium Japanese 2D anime sequence.
          Original dark forensic mystery in cold rain-blue and charcoal tones; mature adult anatomy, controlled cinematic
          lighting, physically realistic evidence handling, ordinary cuts only, stable hands, and restrained micro-expression.
          Never live action, celebrity likeness, chibi, 3D plastic skin, comic page, slideshow, split screen, collage,
          picture-in-picture, poster, monitor, dashboard, evidence wall, panel border, readable writing, subtitle,
          watermark, logo, timecode, source-image text or lettered clothing. No uniform labels or letters such as POLIN.

          Reference A is a clean crop of storyboard panel 2. It supplies ONLY the diagonal floor-body staging; it is not a
          crop instruction and must never be visible. Reference B is a clean character lock containing only the male forensic
          doctor Jian Ci / 检刺 and detective Lin Qian / 林浅. Keep their faces, black hair, adult proportions, wardrobe and
          quiet professional temperament unchanged: Jian Ci is tall/slim/pale, white forensic coat over black high neck and
          black gloves; Lin Qian has a chin-length black bob, unlettered dark-navy field jacket and black trousers. Do not
          reproduce either reference image, its colors as UI, its edges, or its layout.

          Use synchronized calm Mandarin dialogue, rain and room ambience, subtle shutter/tool/evidence-bag foley and a low
          original suspense score. No random speech, scream, extra people or on-screen captions. Zhong Ning has a distinct
          steady young-adult female voice; Lin Qian does not speak for her.
          """

          storyboard = """
          S1E01 PART 2 — 密室尸检 / locked-room examination. Follow this exact twelve-shot storyboard order as real animation:

          1, 0.00–0.65: In rain, officers carefully open the already-documented old clinic door; no person is yet mistaken
          for the witness and no body is shown as a partial crop.
          2, 0.65–2.80: LOCKED OFF extra-wide evidence reveal of Zhong Yuan / 钟远, exactly once: 64-year-old Chinese male
          former clinic director, lying diagonally on wet clinic tile. It must be a clean single camera view with his entire
          connected body visible simultaneously from top of head through both shoes: head, neck, torso, pelvis, both arms,
          thighs, knees, calves, ankles and feet. No person, door, furniture, shadow or transition obscures him. Hold without
          a cut or dissolve through 2.80 seconds; the frames at 1.20, 1.70 and 2.20 seconds must all be this same clean,
          complete, head-to-shoes proof composition.
          3, 2.80–3.90: Detail of the single silver dagger at Zhong Yuan's UPPER CHEST / STERNUM.
          4, 3.90–4.80: Jian Ci, in black gloves, photographs and measures the chest entry point from outside the perimeter.
          5, 4.80–5.75: Lin Qian examines the rain-streaked sealed window.
          6, 5.75–6.75: Close physical view of the old inner door chain, untouched and locked.
          7, 6.75–7.75: A faded old family photo is found close to the scene; it has no readable writing.
          8, 7.75–8.75: Zhong Ning / 钟宁, a living 24-year-old Chinese woman with a low dark ponytail and an unlettered beige
          raincoat, stands upright behind the cordon holding the photo. She is the daughter and first witness, not police,
          not the corpse, not injured, not unconscious and never on the floor.
          9, 8.75–9.85: A blue ultraviolet forensic light reveals faint trace residue only near the fixed silver dagger.
          10, 9.85–10.95: Jian Ci observes the dagger insertion angle, a calm close reaction with lower-eyelid tension.
          11, 10.95–12.15: Lin Qian seals a small trace in an ordinary clear evidence bag.
          12, 12.15–15.00: Jian Ci, Lin Qian, Zhou Yu and upright Zhong Ning quietly compare the physical photo, chain and
          bag on an ordinary table; no monitor, UI, montage or additional corpse.

          Absolute victim and injury lock: There is only one corpse, Zhong Yuan. He wears rain-damp charcoal clinic shirt,
          dark trousers and dark shoes. His anatomy stays intact and motionless in every shot; no missing lower body,
          missing legs/feet, amputation, severed/fused/duplicated limbs, blanket, extra body or extra weapon. He has exactly
          one visible injury: a single short silver dagger embedded in the CENTER OF THE UPPER CHEST BONE, at nipple/sternum
          level, clearly high above the waistline, belt, navel and lower ribs. It is never in the abdomen, solar plexus,
          belly, pelvis or below the lower ribs. Keep a broad expanse of uninjured charcoal shirt visibly between the small
          chest blood mark and the belt. Only a small localized non-graphic blood mark at that chest entry point; head, face,
          hair, neck, arms, abdomen, pelvis, legs, feet and floor beside the head are clean and uninjured: no red liquid,
          blood pool, spray, gore, second wound or extra knife. The dagger never moves, rotates or is removed.

          Mandarin dialogue, quiet and in this order:
          Narrator: 雨没有停，钟远的诊室却已经没有第二个人。
          检刺: 先固定全身位置。钟远只有胸口这一处银刃伤。
          林浅: 门链和窗户都没有被撬过。
          林浅: 钟宁，留在警戒线外。你是第一发现人。
          钟宁: 钟远是我父亲。我一直在门外。
          检刺: 先封存门链、血样和刃口残留。
          """

          client = SegmindClient()

          def upload(path):
              response = client.files.upload(path)
              urls = response.get("file_urls") or []
              if not urls:
                  raise RuntimeError(f"Segmind upload returned no reference URL for {path}: {response}")
              return urls[0]

          request = {
              "model": "seedance-2.0-mini",
              "duration": 15,
              "resolution": "480p",
              "aspect_ratio": "16:9",
              "generate_audio": True,
              "bitrate_mode": "high",
              "seed": 20260801,
              "reference_images": 2,
              "approval": "author-approved exception: regenerate from storyboard after rejected anatomy result",
          }
          state = {
              "state": "starting",
              "episode": "S1E01",
              "segment": "02",
              "purpose": "storyboard-exact complete-body review only; no episode merge",
              "settings": request,
          }
          state_path = FINAL / "s1e01_part2_storyboard_exact_review_status.json"

          def save_state():
              state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding="utf-8")

          save_state()
          job = client.submit_async(
              "seedance-2.0-mini",
              prompt=f"{common}\n\n{storyboard}",
              reference_images=[upload(body_staging), upload(cast_lock)],
              duration=15,
              resolution="480p",
              aspect_ratio="16:9",
              generate_audio=True,
              bitrate_mode="high",
              seed=20260801,
          )
          state.update(state="processing", request_id=job.request_id)
          save_state()
          print("Segmind request ID:", job.request_id, flush=True)

          result = job.wait(timeout=1800, interval=5)
          (RAW / "s1e01_part2_storyboard_exact_result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, default=str), encoding="utf-8"
          )
          source_url = extract_video_url(result)
          response = requests.get(source_url, timeout=300)
          response.raise_for_status()
          raw_video = RAW / "segment_02.mp4"
          raw_video.write_bytes(response.content)

          final_video = FINAL / "segment_02.mp4"
          run(
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(raw_video),
              "-vf", "fps=24,scale=854:480:force_original_aspect_ratio=decrease,pad=854:480:(ow-iw)/2:(oh-ih)/2",
              "-map", "0:v:0", "-map", "0:a?", "-c:v", "libx264", "-crf", "18",
              "-c:a", "aac", "-b:a", "192k", "-movflags", "+faststart", str(final_video),
          )

          proof_times = (1.20, 1.70, 2.20)
          proof_frames = []
          for second in proof_times:
              frame = FINAL / f"S1E01_Part2_storyboard_exact_proof_{second:.2f}s.jpg"
              run(
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(final_video),
                  "-ss", f"{second:.2f}", "-frames:v", "1", "-q:v", "2", str(frame),
              )
              proof_frames.append(frame.name)

          probe = json.loads(subprocess.run(
              [
                  "ffprobe", "-v", "error", "-show_entries",
                  "format=duration:stream=codec_type,width,height,avg_frame_rate", "-of", "json", str(final_video),
              ],
              check=True, capture_output=True, text=True,
          ).stdout)
          streams = probe.get("streams", [])
          video_stream = next((item for item in streams if item.get("codec_type") == "video"), {})
          technical_qc = {
              "duration_seconds": float(probe.get("format", {}).get("duration", 0)),
              "has_audio": any(item.get("codec_type") == "audio" for item in streams),
              "width": video_stream.get("width"),
              "height": video_stream.get("height"),
              "frame_rate": video_stream.get("avg_frame_rate"),
          }
          if (
              technical_qc["duration_seconds"] < 14.5
              or technical_qc["width"] != 854
              or technical_qc["height"] != 480
              or not technical_qc["has_audio"]
          ):
              raise RuntimeError(f"Part 2 failed technical QC: {technical_qc}")

          qa = {
              "episode": "S1E01",
              "segment": "02",
              "technical_qc": technical_qc,
              "evidence_frames": proof_frames,
              "manual_visual_gates": [
                  "All three proof frames show Zhong Yuan once, head through both feet/shoes, with no obstruction or transition.",
                  "The only injury is one silver dagger in the upper chest/sternum, visibly far above the waist/belt.",
                  "No blood pool or injury appears at the head or anywhere other than that chest entry point.",
                  "Zhong Ning is a living, upright daughter/witness; no screen letters, UI or storyboard contamination appears.",
                  "No title, subtitles, merge, or edits to Parts 1, 3, or 4 were made.",
              ],
              "status": "technical_qc_passed_pending_author_visual_approval_before_merge",
          }
          (FINAL / "S1E01_Part2_storyboard_exact_QA.json").write_text(
              json.dumps(qa, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          state.update(state="completed", saved_files=[final_video.name, *proof_frames])
          save_state()
          PY

      - name: Upload review-only artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S1E01-Part2-storyboard-exact-review-${{ github.run_id }}
          path: |
            final/segment_02.mp4
            final/S1E01_Part2_storyboard_exact_proof_1.20s.jpg
            final/S1E01_Part2_storyboard_exact_proof_1.70s.jpg
            final/S1E01_Part2_storyboard_exact_proof_2.20s.jpg
            final/S1E01_Part2_storyboard_exact_QA.json
            final/s1e01_part2_storyboard_exact_review_status.json
            raw/s1e01_part2_storyboard_exact_result.json
          if-no-files-found: warn
          retention-days: 30
