name: Jian Ci Episode 14 Remaining Two Shots
on:
  push:
    branches: [codex/jianci-transition-20260905]
    paths: [video-tests/jianci-ep14-xrtoken/complete.request.json]
permissions:
  contents: read
concurrency:
  group: jianci-ep14-completion
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video processing dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate only previously unsubmitted shots 05 and 06
        env:
          XRTOKEN: ${{ secrets.XRTOKEN }}
          JIANCI_EP14_EXECUTE: '1'
        run: python video-tests/jianci-ep14-xrtoken/complete.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jianci-ep14-completion
          path: output/jianci-ep14-completion
          retention-days: 14
