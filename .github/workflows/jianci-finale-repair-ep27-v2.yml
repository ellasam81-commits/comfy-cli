name: Jian Ci Finale EP27 Local Fallback Repair
on:
  push:
    branches: [codex/jianci-transition-20260905]
    paths: [video-tests/jianci-finale-xrtoken/repair27-v2.request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: jianci-finale-ep27-local-fallback
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Build EP27 locally without third paid attempt
        env:
          XRTOKEN: ${{ secrets.XRTOKEN }}
          JIANCI_EXECUTE: '1'
        run: python video-tests/jianci-finale-xrtoken/repair_27_v2.py
      - name: Upload repaired EP27
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianci-finale-repair-ep27-v2
          path: output/jianci-finale-repair-v2/ep27
          retention-days: 14
