name: Jian Ci Case 2 V5 Production
on:
  push:
    branches: [codex/jianci-transition-20260905]
    paths: [video-tests/jianci-case2-v5/run.request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: jianci-case2-v5
  cancel-in-progress: false
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - episode: 15
            config: episode15-repair.json
            batch: '-repair'
          - episode: 16
            config: episode16.json
            batch: ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg before any paid request
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate one bounded episode batch
        env:
          XRTOKEN: ${{ secrets.XRTOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          JIANCI_EXECUTE: '1'
          EPISODE: ${{ matrix.episode }}
          CONFIG_FILE: ${{ matrix.config }}
          BATCH: ${{ matrix.batch }}
        run: python video-tests/jianci-case2-v5/generate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jianci-case2-v5-ep${{ matrix.episode }}${{ matrix.batch }}
          path: output/jianci-case2-v5
          retention-days: 14
