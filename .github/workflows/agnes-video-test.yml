name: Agnes video connection test
on:
  push:
    branches: [agnes-video-test-20260930]
    paths: [.github/workflows/agnes-video-test.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agnes-video-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate one five-second video
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ.get("AGNES_API_KEY", "").strip()
          if not key:
              sys.exit("::error::AGNES_API_KEY is missing. Add it in repository Actions secrets.")
          root = "https://apihub.agnes-ai.com"
          model = "agnes-video-2.5-flash"
          out = pathlib.Path("output")
          out.mkdir(exist_ok=True)

          def api(path, payload=None):
              request = urllib.request.Request(
                  root + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  sys.exit(f"::error::Agnes API returned HTTP {error.code}. No new generation will be submitted.")

          payload = {
              "model": model,
              "prompt": "A cute orange kitten in cinematic 2D Japanese anime style sits on a moonlit windowsill, then slowly turns its head toward the camera and blinks. One continuous shot, gentle natural motion, stable character design, soft blue lighting, no text, no subtitles.",
              "mode": "text",
              "seconds": "5",
              "size": "720P",
              "aspect_ratio": "9:16",
              "n": 1,
          }
          created = api("/v1/videos", payload)
          video_id = created.get("video_id") or created.get("id") or created.get("task_id")
          if not video_id:
              sys.exit("::error::Agnes returned no video task ID.")
          (out / "task.json").write_text(json.dumps({"video_id": video_id, "model": model}))
          print("One generation submitted; polling its existing task.", flush=True)
          query = urllib.parse.urlencode({"video_id": video_id, "model_name": model})
          deadline = time.monotonic() + 900
          while time.monotonic() < deadline:
              result = api("/agnesapi?" + query)
              status = str(result.get("status", "")).lower()
              print("Status:", status, "Progress:", result.get("progress", ""), flush=True)
              if status in {"failed", "error", "cancelled", "canceled"}:
                  sys.exit("::error::Agnes video generation failed. No automatic regeneration.")
              if status in {"completed", "succeeded", "success", "done"}:
                  url = result.get("url") or result.get("video_url")
                  if not isinstance(url, str) or urllib.parse.urlsplit(url).scheme != "https":
                      sys.exit("::error::Completed task returned no HTTPS video URL.")
                  with urllib.request.urlopen(url, timeout=120) as response:
                      with (out / "agnes-test-5s.mp4").open("wb") as target:
                          while chunk := response.read(1024 * 1024):
                              target.write(chunk)
                  print("Video downloaded.", flush=True)
                  break
              time.sleep(15)
          else:
              sys.exit("::error::Timed out. Existing task ID is saved; do not submit again.")
          PY
      - name: Inspect video and audio streams
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of json output/agnes-test-5s.mp4 > output/probe.json
          cat output/probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agnes-video-test
          path: output/
          if-no-files-found: ignore
          retention-days: 7
