name: Agnes Silk Sheets availability test
on:
  push:
    branches: [agnes-video-test-20260930]
    paths: [.github/workflows/agnes-video-test.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agnes-silk-sheets-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Generate one anime clip
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY || secrets.Agnes_api }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys, time, urllib.error, urllib.parse, urllib.request
          key = os.environ.get("AGNES_API_KEY", "").strip()
          if not key:
              sys.exit("Agnes API secret is missing.")
          root = "https://apihub.agnes-ai.com"
          model = "agnes-video-2.5-flash"
          out = pathlib.Path("output")
          out.mkdir(exist_ok=True)
          def api(path, payload=None):
              req = urllib.request.Request(root + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read(4096).decode(errors="replace").replace(key, "[REDACTED]")
                  (out / "error.json").write_text(json.dumps({"http_status": exc.code, "detail": detail}))
                  sys.exit("Agnes HTTP " + str(exc.code) + ": " + detail)
          payload = {
              "model": model, "mode": "text", "seconds": "5", "size": "720P",
              "aspect_ratio": "16:9", "n": 1,

              "prompt": "One continuous cinematic anime shot, 5 seconds. An adult slender man with wet tousled black hair, pale skin, silver earrings and a black shimmering shirt sits in shallow reflective water at night. Translucent silver lavender silk ribbons float gently around him. He slowly raises his face toward a luminous rectangular doorway with a large moon behind it. The camera gently pulls back, revealing white lotus flowers and ripples catching moonlight. Dreamy dark purple and silver palette, delicate anime facial design, strong spatial depth, natural subtle breathing and cloth motion, stable male identity, graceful anatomy. No collage, no storyboard panels, no text, no titles, no subtitles, no logos. Quiet water ambience, no spoken dialogue."
          }
          (out / "request.json").write_text(json.dumps(payload, indent=2))
          created = api("/v1/videos", payload)
          video_id = created.get("video_id")
          if not video_id:
              (out / "create_response.json").write_text(json.dumps(created))
              sys.exit("No video_id returned. Do not resubmit automatically.")
          (out / "task.json").write_text(json.dumps({"video_id": video_id, "model": model}))
          print("Submitted ONE generation. Task:", video_id, flush=True)
          query = urllib.parse.urlencode({"video_id": video_id, "model_name": model})
          deadline = time.monotonic() + 900
          while time.monotonic() < deadline:
              result = api("/agnesapi?" + query)
              (out / "result.json").write_text(json.dumps(result))
              status = str(result.get("status", "")).lower()
              print("Status:", status, "Progress:", result.get("progress"), flush=True)
              if status in {"failed", "error", "cancelled", "canceled"}:
                  sys.exit("Generation failed. No automatic regeneration.")
              if status in {"completed", "succeeded", "success", "done"}:
                  url = result.get("url")
                  if not isinstance(url, str) or urllib.parse.urlsplit(url).scheme != "https":
                      sys.exit("Completed task has no HTTPS video URL.")
                  with urllib.request.urlopen(url, timeout=120) as response, (out / "Silk_Sheets_Agnes_Test_5s.mp4").open("wb") as target:
                      while chunk := response.read(1024 * 1024):
                          target.write(chunk)
                  print("Video downloaded.", flush=True)
                  break
              time.sleep(15)
          else:
              sys.exit("Timeout. Saved task ID. Do not resubmit.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silk-sheets-agnes-test
          path: output/
          retention-days: 7
