name: Generate S1E04 — clips 02-12 (one shot each)

on:
  push:
    branches: [render/s1e04-final-v1]
    paths: ["references/s1e04/run-clips02-12.txt"]

permissions:
  contents: read
  actions: read

concurrency:
  group: s1e04-remainder-v1
  cancel-in-progress: false

jobs:
  generate-remainder:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      WHISPER_CACHE_DIR: /tmp/faster-whisper-s1e04-remainder
      GENERATION_OUTPUT_DIR: output/s1e04-remainder
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce exact one-shot authorization
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Workflow reruns are forbidden."; exit 2; }
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "references/s1e04/run-clips02-12.txt" ]] || { echo "::error::Only trigger may change."; exit 2; }
          [[ "$(cat references/s1e04/run-clips02-12.txt)" == "AUTHOR-APPROVED: GENERATE S1E04 CLIPS 02-12 ONCE EACH" ]] || exit 2
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
      - name: Install generation and QC tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" "faster-whisper==1.2.1" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip curl
      - name: Validate all inputs before paid requests
        run: python -m py_compile scripts/generate_s1e04_remainder.py
      - name: Generate clips 02-12 once each and check Mandarin audio
        run: python scripts/generate_s1e04_remainder.py
      - name: Upload complete raw video, proof frames and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S1E04-Remainder-02-12
          path: |
            output/s1e04-remainder/raw/
            output/s1e04-remainder/audit/
            output/s1e04-remainder/proof/
            output/s1e04-remainder/last_frames/
            output/s1e04-remainder/runtime_refs/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
