name: Inspect S1E05 speaker-repair runs (no Segmind)

on:
  pull_request:
    branches: [main]
    paths: ["references/s1e05/run-speaker-repair-inspection.txt"]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read recent render-branch workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inspection
          curl --fail --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=render%2Fs1e05-final-v1&event=push&per_page=50"             > /tmp/s1e05-runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("/tmp/s1e05-runs.json").read_text())
          wanted = []
          for run in source.get("workflow_runs", []):
              name = run.get("name", "")
              path = run.get("path", "")
              if (
                  "09" in name
                  or "12" in name
                  or "speaker" in name.lower()
                  or "clips09-12" in path
                  or "clips09-12" in name
              ):
                  wanted.append(
                      {
                          "id": run.get("id"),
                          "name": name,
                          "path": path,
                          "event": run.get("event"),
                          "status": run.get("status"),
                          "conclusion": run.get("conclusion"),
                          "head_sha": run.get("head_sha"),
                          "created_at": run.get("created_at"),
                          "updated_at": run.get("updated_at"),
                          "artifacts_url": run.get("artifacts_url"),
                          "html_url": run.get("html_url"),
                      }
                  )
          result = {
              "inspection_workflow_run_id": "${{ github.run_id }}",
              "render_branch": "render/s1e05-final-v1",
              "matching_runs": wanted,
          }
          Path("inspection/action-runs-scan.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: S1E05-speaker-repair-run-scan
          path: inspection/action-runs-scan.json
          retention-days: 7
