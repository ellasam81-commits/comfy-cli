name: Generate S1E05 — clip 01 gate (one shot)

on:
  push:
    branches: [render/s1e05-final-v1]
    paths: ["references/s1e05/run-clip01-gate.txt"]

permissions:
  contents: read
  actions: read

concurrency:
  group: s1e05-clip01-gate-v1
  cancel-in-progress: false

jobs:
  generate-clip01:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
      WHISPER_CACHE_DIR: /tmp/faster-whisper-s1e05-clip01
      GENERATION_OUTPUT_DIR: output/s1e05-clip01-gate
      ONLY_CLIP_ID: "01"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce exactly one initial request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Workflow reruns are forbidden."; exit 2; }
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "references/s1e05/run-clip01-gate.txt" ]] || { echo "::error::Only the one-shot authorization trigger may change."; exit 2; }
          [[ "$(cat references/s1e05/run-clip01-gate.txt)" == "AUTHOR-APPROVED: GENERATE S1E05 CLIP 01 ONCE" ]] || exit 2
          [[ -n "$SEGMIND_API_KEY" ]] || { echo "::error::Missing SEGMIND_API_KEY; no paid request made."; exit 2; }
      - name: Install generation and QC tools
        run: |
          python -m pip install --upgrade pip
          pip install "segmind==1.1.0" "faster-whisper==1.2.1" requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Dry-run contract validation before paid request
        run: |
          python -m py_compile scripts/generate_s1e05_five_second.py
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('references/s1e05/five_second_plan.json').read_text(encoding='utf-8'))
          assert plan['episode']=='S01E05' and len(plan['clips'])==12
          assert all(len(c['shots'])==3 for c in plan['clips'])
          assert Path('references/s1e03/source_refs/jian_ci_identity.jpg').is_file()
          assert Path('references/s1e03/source_refs/character_chart_highres.jpeg').is_file()
          assert all(Path(f'references/s1e05/panels/clip_01_shot_{i}.jpg.b64').is_file() for i in range(1,4))
          print('Preflight passed: 12 ordered clips, three shots each, Jian Ci no-glasses authority present.')
          PY
      - name: Generate clip 01 once and check Mandarin audio
        run: python scripts/generate_s1e05_five_second.py
      - name: Upload raw clip, proof frames and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S1E05-Clip01-Gate
          path: |
            output/s1e05-clip01-gate/raw/
            output/s1e05-clip01-gate/audit/
            output/s1e05-clip01-gate/proof/
            output/s1e05-clip01-gate/last_frames/
            output/s1e05-clip01-gate/runtime_refs/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
